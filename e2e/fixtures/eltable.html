<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>el-table 分表结构 · 真实测试装置</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 20px; }
  .el-table { border: 1px solid #cbd5e1; width: 640px; }
  .el-table__header-wrapper table, .el-table__body-wrapper table { border-collapse: collapse; width: 100%; }
  .el-table__header-wrapper th, .el-table__header-wrapper td,
  .el-table__body-wrapper td { border: 1px solid #e2e8f0; padding: 6px 10px; font-size: 13px; }
  .el-table__header-wrapper th { background: #f8fafc; }
  /* 表头表在 DOM 里可见（真实 el-table 也是这样两张表），但视觉上只有一张 */
  .el-table__header-wrapper { position: static; }
  .el-table__body-wrapper { position: static; }
</style>
</head>
<body>
<h1>el-table 分表（表头表 + 数据表）</h1>

<div class="el-table">
  <div class="el-table__inner-wrapper">
    <div class="el-table__header-wrapper">
      <table>
        <thead><tr><th>应用名称</th><th>审核状态</th></tr></thead>
      </table>
    </div>
    <div class="el-table__body-wrapper">
      <table>
        <tbody>
          <tr><td>夸夸盒</td><td>审核不通过</td></tr>
          <tr><td>网盘助手</td><td>审核中</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
