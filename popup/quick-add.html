<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快速添加关键词</title>
  <link rel="stylesheet" href="quick-add.css">
</head>
<body>
  <div class="qa-wrap">
    <header class="qa-header">
      <span class="qa-icon">➕</span>
      <div class="qa-title-box">
        <h1 class="qa-title">快速添加关键词</h1>
        <span class="qa-subtitle">输入要高亮的词，可附加备注与重要笔记</span>
      </div>
    </header>

    <form class="qa-form" id="qaForm" novalidate>
      <!-- 关键词 -->
      <div class="qa-field">
        <label class="qa-label" for="qwText">关键词 <em>*</em></label>
        <input type="text" id="qwText" class="qa-input" placeholder="输入要高亮的关键词" maxlength="100" autofocus>
      </div>

      <!-- 备注 -->
      <div class="qa-field">
        <div class="qa-label-row">
          <label class="qa-label" for="qwNote">备注内容</label>
          <button type="button" class="qa-hint" id="qwNoteHint"
            data-tip="支持 Markdown：**加粗**、*斜体*、[文字](网址)；纯网址自动变可点击链接；多行输入换行原样保留。">ⓘ 格式说明</button>
        </div>
        <textarea id="qwNote" class="qa-textarea" rows="3" placeholder="点击高亮词时显示的备注（可选）"></textarea>
      </div>

      <!-- 重要 -->
      <div class="qa-field">
        <label class="qa-check">
          <input type="checkbox" id="qwImportant">
          <span class="qa-check-mark"></span>
          <span class="qa-check-label">📌 标记为重要 <span class="qa-check-sub">（可填重要笔记）</span></span>
        </label>
      </div>

      <!-- 重要笔记（勾选后展开） -->
      <div class="qa-field" id="importantNoteField">
        <div class="qa-label-row">
          <label class="qa-label" for="qwImportantNote">重要笔记</label>
          <button type="button" class="qa-hint qa-hint-above" id="qwImportantNoteHint"
            data-tip="命中关键词时在页面右上角置顶显示。支持 Markdown：**加粗**、*斜体*、[文字](网址)；多行输入换行原样保留。">ⓘ 说明</button>
        </div>
        <textarea id="qwImportantNote" class="qa-textarea" rows="4" placeholder="输入重要笔记内容（可选）"></textarea>
        <p class="qa-field-tip">💡 勾选「标记为重要」后才会展开此输入；留空则命中时不高亮提示。</p>
      </div>

      <!-- 操作 -->
      <div class="qa-actions">
        <button type="button" class="qa-btn qa-cancel" id="qwCancel">取消</button>
        <button type="submit" class="qa-btn qa-save" id="qwSave">保存</button>
      </div>
    </form>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="quick-add.js"></script>
</body>
</html>
